<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101413" />
    <link rel="icon" href="/favicon.svg" />
    <title>daroad</title>
  </head>
  <body>
    <div id="app" class="is-landing">
      <div id="scene"></div>

      <header class="brand">
        <span class="brand-lockup"><span class="brand-name">daroad</span></span>
      </header>

      <section id="search" class="search panel" aria-label="Address search" data-i18n-label="Address search"></section>
      <details class="neighbourhoods panel"><summary data-i18n="Neighbourhoods">Neighbourhoods</summary><div id="neighbourhood-list"></div></details>
      <div id="noise-switch" class="noise-switch panel" hidden></div>
      <div id="sun-dial" class="sun-dial panel" hidden aria-hidden="true"></div>
      <div class="bottom-dock">
        <nav class="view-controls panel" aria-label="Map view" data-i18n-label="Map view">
          <button data-view="overview" aria-pressed="true" data-i18n="Overview">Overview</button><button data-view="sale" aria-pressed="false" data-i18n="Price">Price</button><button data-view="noise" aria-pressed="false" data-i18n="Noise">Noise</button><button data-view="parking" aria-pressed="false" data-i18n="Parking">Parking</button><button data-view="sun" aria-pressed="false" data-i18n="Sun">Sun</button>
        </nav>
        <aside id="price-legend" class="price-legend panel" hidden></aside>
        <aside id="sun-panel" class="sun-panel panel" hidden aria-label="Sun and shadows" data-i18n-label="Sun and shadows"></aside>
        <span class="hint" data-i18n="Scroll to zoom · Shift + drag to rotate">Scroll to zoom · Shift + drag to rotate</span>
      </div>
      <div id="area-info" class="area-info panel" hidden role="status"></div>
      <div id="data-status" role="status"></div>
      <nav class="map-tools panel" aria-label="Map controls" data-i18n-label="Map controls">
        <button id="tool-home" type="button" title="Reset view (Home)" aria-label="Reset view" data-i18n-title="Reset view (Home)" data-i18n-label="Reset view">⌂</button>
        <button id="tool-zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in" data-i18n-title="Zoom in (+)" data-i18n-label="Zoom in">+</button>
        <button id="tool-zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out" data-i18n-title="Zoom out (−)" data-i18n-label="Zoom out">−</button>
        <button id="tool-overhead" type="button" title="Overhead view" aria-label="Toggle overhead view" data-i18n-title="Overhead view" data-i18n-label="Toggle overhead view">2D</button>
        <button id="tool-north" type="button" title="Face north" aria-label="Face north" data-i18n-title="Face north" data-i18n-label="Face north"><span id="compass">N</span></button>
        <button id="tool-lang" class="tool-lang" type="button"></button>
      </nav>

      <div class="map-caption"><span class="scale-line"></span><span id="scale-label">100 m</span></div>

      <aside id="building-card" class="building-card panel" hidden aria-live="polite"></aside>

      <div id="landing" class="landing">
        <div class="landing-inner">
          <h1 class="landing-title"><span class="brand-lockup landing-brand"><span class="brand-name">daroad</span></span></h1>
          <p class="landing-hook" data-i18n-html="See the street &lt;em&gt;before&lt;/em&gt; you see the flat.">See the street <em>before</em> you see the flat.</p>
          <p class="landing-text" data-i18n="Found a flat to rent in Helsinki? Check the rent, noise, parking and transport around it before the viewing.">Found a flat to rent in Helsinki? Check the rent, noise, parking and transport around it before the viewing.</p>
          <div id="landing-cue" class="landing-cue"><span class="mouse" aria-hidden="true"><i></i></span><span id="landing-status" role="status" data-i18n="loading the map…">loading the map…</span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
