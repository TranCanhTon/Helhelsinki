<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101413" />
    <link rel="icon" href="/favicon.svg" />
    <title>daroad</title>
  </head>
  <body>
    <div id="app" class="is-landing">
      <div id="scene"></div>
      <div class="haze" aria-hidden="true"></div>

      <header class="brand">
        <span class="brand-lockup"><span class="brand-name">daroad</span></span>
      </header>

      <section id="search" class="search panel" aria-label="Address search" data-i18n-label="Address search"></section>
      <div class="left-column">
        <details class="neighbourhoods panel"><summary data-i18n="Neighbourhoods">Neighbourhoods</summary><div id="neighbourhood-list"></div></details>
        <div id="data-status" role="status"></div>
      </div>
      <div id="noise-switch" class="noise-switch panel" hidden></div>
      <div id="sun-dial" class="sun-dial panel" hidden aria-hidden="true"></div>
      <div class="bottom-dock">
        <aside id="price-legend" class="price-legend panel" hidden></aside>
        <aside id="sun-panel" class="sun-panel panel" hidden aria-label="Sun and shadows" data-i18n-label="Sun and shadows"></aside>
        <nav class="view-controls panel" aria-label="Map view" data-i18n-label="Map view">
          <button data-view="overview" aria-pressed="true" data-i18n="Overview">Overview</button><button data-view="sale" aria-pressed="false" data-i18n="Price">Price</button><button data-view="noise" aria-pressed="false" data-i18n="Noise">Noise</button><button data-view="parking" aria-pressed="false" data-i18n="Parking">Parking</button><button data-view="ads" aria-pressed="false" hidden data-i18n="Ads">Ads</button><button data-view="sun" aria-pressed="false" data-i18n="Sun">Sun</button>
        </nav>
        <span class="hint" data-i18n="Scroll to zoom · Shift + drag to rotate">Scroll to zoom · Shift + drag to rotate</span>
      </div>
      <div id="area-info" class="area-info panel" hidden role="status"></div>
      <div id="hover-tip" class="hover-tip" hidden aria-hidden="true"></div>
      <nav class="map-tools panel" aria-label="Map controls" data-i18n-label="Map controls">
        <button id="tool-home" type="button" title="Reset view (Home)" aria-label="Reset view" data-i18n-title="Reset view (Home)" data-i18n-label="Reset view"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11 12 4.5l7.5 6.5"/><path d="M6.5 9.5v9.5h4v-5h3v5h4V9.5"/></svg></button>
        <button id="tool-zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in" data-i18n-title="Zoom in (+)" data-i18n-label="Zoom in"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
        <button id="tool-zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out" data-i18n-title="Zoom out (−)" data-i18n-label="Zoom out"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12h13"/></svg></button>
        <button id="tool-overhead" type="button" title="Overhead view" aria-label="Toggle overhead view" data-i18n-title="Overhead view" data-i18n-label="Toggle overhead view"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="icon-2d"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M5 12h14M12 5v14"/></g><g class="icon-3d"><path d="M12 3.8 19.5 8v8L12 20.2 4.5 16V8z"/><path d="M4.5 8 12 12.2 19.5 8M12 12.2v8"/></g></svg></button>
        <button id="tool-north" type="button" title="Face north" aria-label="Face north" data-i18n-title="Face north" data-i18n-label="Face north"><span id="compass"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="needle-n" d="M12 3.5 15 12H9z"/><path class="needle-s" d="M9 12h6l-3 8.5z"/></svg></span></button>
        <button id="tool-saved" class="tool-in-menu" type="button" title="Saved" aria-label="Saved buildings" aria-controls="saved-panel" data-i18n-title="Saved" data-i18n-label="Saved buildings"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.6l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></svg></button>
        <button id="tool-sources" class="tool-in-menu" type="button" title="Sources" aria-label="Sources" data-i18n-title="Sources" data-i18n-label="Sources"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></svg></button>
        <button id="tool-lang" class="tool-lang tool-in-menu" type="button"></button>
        <button id="tool-more" type="button" title="Menu" aria-label="Menu" aria-expanded="false" data-i18n-title="Menu" data-i18n-label="Menu"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      </nav>

      <div class="map-caption"><span class="scale-line"></span><span id="scale-label">100 m</span></div>

      <aside id="building-card" class="building-card panel" hidden aria-live="polite"></aside>
      <aside id="saved-panel" class="saved-panel panel" hidden aria-label="Saved buildings" data-i18n-label="Saved buildings"></aside>
      <aside id="sources-panel" class="sources-panel panel" hidden aria-label="Sources" data-i18n-label="Sources"></aside>

      <div id="landing" class="landing">
        <div class="landing-inner">
          <h1 class="landing-title"><span class="brand-lockup landing-brand"><span class="brand-name">daroad</span></span></h1>
          <p class="landing-hook" data-i18n-html="See the street &lt;em&gt;before&lt;/em&gt; you see the flat.">See the street <em>before</em> you see the flat.</p>
          <p class="landing-text" data-i18n="Found a flat to rent in Helsinki? Check the rent, noise, parking and transport around it before the viewing.">Found a flat to rent in Helsinki? Check the rent, noise, parking and transport around it before the viewing.</p>
          <div id="landing-cue" class="landing-cue"><span class="mouse" aria-hidden="true"><i></i></span><span id="landing-status" role="status" data-i18n="loading the map…">loading the map…</span><span class="landing-bar" hidden><i></i></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
